<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palette</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,200;9..144,400&family=Montserrat:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family: "Manrope", sans-serif;
        background-image: url("bg.png");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
      }

      /* ---- hero: existing content pushed to the top ---- */
      .hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 14vh 1.5rem 4rem;
      }

      .content {
        position: relative;
        z-index: 1;
        text-align: center;
        color: #fff;
        padding: 2rem;
        max-width: 640px;
      }

      .tagline {
        font-size: 0.85rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0.7;
        margin-bottom: 1.25rem;
      }

      h1 {
        font-family: "Fraunces", serif;
        font-size: clamp(3.5rem, 16vw, 9rem);
        font-weight: 200;
        letter-spacing: 1rem;
        margin-bottom: 0.35rem;
      }

      .caption {
        font-family: "Montserrat", sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.5;
        margin-bottom: 1.5rem;
      }

      .description {
        font-size: 1.15rem;
        line-height: 1.6;
        opacity: 0.85;
        margin-bottom: 2.5rem;
      }

      .waitlist-form {
        display: flex;
        gap: 0.5rem;
        max-width: 420px;
        margin: 0 auto;
      }

      .waitlist-form input {
        flex: 1;
        font-family: "Manrope", sans-serif;
        padding: 0.75rem 1rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font-size: 0.95rem;
        outline: none;
        backdrop-filter: blur(4px);
      }

      .waitlist-form input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      .waitlist-form input:focus {
        border-color: rgba(255, 255, 255, 0.6);
      }

      .waitlist-form button {
        font-family: "Manrope", sans-serif;
        padding: 0.75rem 1.25rem;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 6px;
        font-size: 0.95rem;
        font-weight: 400;
        cursor: pointer;
        white-space: nowrap;
        transition: opacity 0.15s;
      }

      .waitlist-form button:hover {
        opacity: 0.85;
      }

      .message {
        margin-top: 1rem;
        font-size: 0.9rem;
        opacity: 0.75;
        min-height: 1.2em;
      }

      /* ---- example prompts showcase (matches Palette's app UI) ---- */
      .showcase {
        position: relative;
        z-index: 1;
        background: #f7f3ee;
        padding: 4.5rem 1.5rem 5.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .showcase-heading {
        font-family: "Fraunces", serif;
        font-weight: 400;
        font-style: italic;
        font-size: 1.5rem;
        color: #a89e95;
        margin-bottom: 1.75rem;
        text-align: center;
      }

      .feed {
        position: relative;
        width: 100%;
        max-width: 560px;
        height: 440px;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          #000 16%,
          #000 84%,
          transparent 100%
        );
        mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          #000 16%,
          #000 84%,
          transparent 100%
        );
      }

      .feed-track {
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
        animation: feed-scroll 44s linear infinite;
        will-change: transform;
      }

      .feed:hover .feed-track {
        animation-play-state: paused;
      }

      @keyframes feed-scroll {
        from {
          transform: translateY(0);
        }
        to {
          /* half the track height (the list is duplicated) minus half a gap */
          transform: translateY(calc(-50% - 0.55rem));
        }
      }

      .msg-user {
        display: flex;
        justify-content: flex-end;
      }

      .bubble {
        max-width: 440px;
        background: #f5efe8;
        color: #1c1a18;
        font-family: "Fraunces", serif;
        font-size: 13px;
        line-height: 1.4;
        padding: 9px 14px;
        border: 0.5px solid #ddd5c8;
        border-right: 3px solid #c4714a;
        border-radius: 6px;
        box-shadow: 0 1px 3px rgba(99, 69, 41, 0.05);
      }

      .msg-ai {
        max-width: 520px;
        margin-right: auto;
        padding-left: 2px;
      }

      .ai-label {
        display: block;
        font-family: "Montserrat", sans-serif;
        font-size: 0.6rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #7a9e7e;
        margin-bottom: 0.35rem;
      }

      .ai-text {
        font-family: "Fraunces", serif;
        font-size: 14px;
        line-height: 1.5;
        color: #1c1a18;
      }

      @media (prefers-reduced-motion: reduce) {
        .feed-track {
          animation: none;
        }
      }

      /* ---- smaller screens ---- */
      @media (max-width: 600px) {
        .content {
          padding: 1.5rem;
        }

        .tagline {
          font-size: 0.75rem;
          letter-spacing: 0.12em;
          margin-bottom: 1rem;
        }

        .description {
          font-size: 1rem;
          margin-bottom: 2rem;
        }

        .waitlist-form {
          flex-direction: column;
          gap: 0.6rem;
        }

        .waitlist-form button {
          width: 100%;
        }

        .showcase {
          padding: 3.5rem 1.25rem 4.5rem;
        }

        .feed {
          height: 380px;
        }

        .showcase-heading {
          font-size: 1.3rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="overlay"></div>
    <section class="hero">
      <div class="content">
        <p class="tagline">
          bridging the gap between taste and technical ability
        </p>
        <h1>Palette</h1>
        <p class="caption" style="margin-top: -0.75rem; font-style: italic">
          built for Ableton
        </p>

        <p class="description">
          Find your sound faster with an audio-first AI co-producer embedded in
          your project.
        </p>
        <form class="waitlist-form" id="waitlist-form">
          <input
            type="email"
            id="email-input"
            placeholder="your@email.com"
            required
          />
          <button type="submit" id="submit-btn">Stay Updated</button>
        </form>
        <p class="message" id="message"></p>
      </div>
    </section>

    <section class="showcase">
      <p class="showcase-heading">Just ask &mdash;</p>
      <div class="feed" aria-hidden="true">
        <div class="feed-track" id="feed-track">
          <template id="feed-items">
            <div class="msg-user">
              <div class="bubble">make this pad warmer and wider</div>
            </div>

            <div class="msg-user">
              <div class="bubble">why does my low end feel muddy?</div>
            </div>
            <div class="msg-ai">
              <span class="ai-label">Palette</span>
              <span class="ai-text"
                >Your kick and bass are both peaking around 60&nbsp;Hz &mdash;
                high-pass the bass and let the kick own the sub.</span
              >
            </div>

            <div class="msg-user">
              <div class="bubble">sidechain the bass to the kick</div>
            </div>

            <div class="msg-user">
              <div class="bubble">build a 4-bar drum fill into the drop</div>
            </div>

            <div class="msg-user">
              <div class="bubble">add a dotted 1/8 delay on the vocal</div>
            </div>

            <div class="msg-user">
              <div class="bubble">give me a darker progression in F minor</div>
            </div>

            <div class="msg-user">
              <div class="bubble">what's clashing in my mix?</div>
            </div>
            <div class="msg-ai">
              <span class="ai-label">Palette</span>
              <span class="ai-text"
                >The pad and the vocal are fighting around 2&ndash;3&nbsp;kHz.
                I'd carve a little space there on the pad.</span
              >
            </div>

            <div class="msg-user">
              <div class="bubble">make the drop hit harder</div>
            </div>
          </template>
        </div>
      </div>
    </section>

    <script>
      // Duplicate the list so the upward scroll loops seamlessly.
      (function () {
        const track = document.getElementById("feed-track");
        const tpl = document.getElementById("feed-items");
        track.appendChild(tpl.content.cloneNode(true));
        track.appendChild(tpl.content.cloneNode(true));
        track.removeChild(tpl);
      })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://teojocqptooweyrrzsyx.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlb2pvY3FwdG9vd2V5cnJ6c3l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMjA5MzMsImV4cCI6MjA5ODU5NjkzM30.CVXdInGEQJXQUPH9ku4FPu0W8xK_Uw_QI8ixO3hy1gk";

      const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      document
        .getElementById("waitlist-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email-input").value.trim();
          const btn = document.getElementById("submit-btn");
          const msg = document.getElementById("message");

          btn.disabled = true;
          btn.textContent = "Joining...";

          const { error } = await client.from("Emails").insert({ email });

          if (error) {
            msg.textContent = "Something went wrong. Please try again.";
            btn.disabled = false;
            btn.textContent = "Join Waitlist";
          } else {
            msg.textContent = "You're on the list.";
            btn.textContent = "Joined";
          }
        });
    </script>
  </body>
</html>
